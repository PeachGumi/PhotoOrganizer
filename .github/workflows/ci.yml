name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.400

      - name: Show SDK
        run: dotnet --info

      - name: Restore tests
        run: dotnet restore tests/PhotoOrganizer.Core.Tests/PhotoOrganizer.Core.Tests.csproj

      - name: Restore app
        run: dotnet restore src/PhotoOrganizer.App/PhotoOrganizer.App.csproj

      - name: Restore platform identity tests
        run: dotnet restore tests/PhotoOrganizer.App.Tests/PhotoOrganizer.App.Tests.csproj

      - name: Run shared safety tests
        run: dotnet test tests/PhotoOrganizer.Core.Tests/PhotoOrganizer.Core.Tests.csproj --configuration Release --no-restore

      - name: Run platform storage identity tests
        run: dotnet test tests/PhotoOrganizer.App.Tests/PhotoOrganizer.App.Tests.csproj --configuration Release --no-restore

      - name: Build unified desktop app
        run: dotnet build src/PhotoOrganizer.App/PhotoOrganizer.App.csproj --configuration Release --no-restore

      - name: Validate macOS product icon generation
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          bash Scripts/build_macos_icon.sh src/PhotoOrganizer.App/Assets/app-icon.ico "$RUNNER_TEMP/PhotoOrganizer.icns"
          test -s "$RUNNER_TEMP/PhotoOrganizer.icns"

  package-smoke-windows:
    name: Package smoke — Windows x64/ARM64
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.400

      - name: Build and round-trip unsigned packages
        shell: pwsh
        run: ./Scripts/smoke_package_windows.ps1 -OutputRoot "$env:RUNNER_TEMP\photo-organizer-package-smoke"

  package-smoke-macos:
    name: Package smoke — macOS arm64/x64
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.400

      - name: Build and mount unsigned DMGs
        shell: bash
        run: bash Scripts/smoke_package_macos.sh 0.0.0-ci "$RUNNER_TEMP/photo-organizer-package-smoke"

  release-contract:
    name: Release contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Parse workflow YAML and packaging XML
        shell: bash
        run: |
          set -euo pipefail
          ruby -e "require 'yaml'; YAML.load_file('.github/workflows/release.yml'); YAML.load_file('.github/workflows/promote-release.yml')"
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse('packaging/macos/PhotoOrganizer.entitlements')
          PY

      - name: Validate release helper syntax
        shell: bash
        run: |
          bash -n Scripts/configure_release_secrets.sh
          bash -n Scripts/build_macos_icon.sh
          bash -n Scripts/smoke_package_macos.sh
          test -s Scripts/smoke_package_windows.ps1

      - name: Enforce fail-closed release contract
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/release.yml
          promotion=.github/workflows/promote-release.yml
          project=src/PhotoOrganizer.App/PhotoOrganizer.App.csproj
          window=src/PhotoOrganizer.App/MainWindow.axaml
          for secret in \
            WINDOWS_CERTIFICATE WINDOWS_CERTIFICATE_PASSWORD \
            MACOS_CERTIFICATE MACOS_CERTIFICATE_PASSWORD DEVELOPER_ID_APPLICATION \
            APPLE_ID APPLE_TEAM_ID APPLE_APP_SPECIFIC_PASSWORD; do
            grep -q "$secret" "$workflow"
          done
          grep -q 'needs: \[preflight, windows, macos\]' "$workflow"
          grep -q 'signtool' "$workflow"
          grep -q 'notarytool submit' "$workflow"
          grep -q 'stapler validate' "$workflow"
          grep -q 'sha256sum -c' "$workflow"
          grep -q 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a' "$workflow"
          grep -q 'actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c' "$workflow"

          # Product identity must survive both desktop builds and signed packaging.
          test -s src/PhotoOrganizer.App/Assets/app-icon.ico
          grep -q '<ApplicationIcon>Assets/app-icon.ico</ApplicationIcon>' "$project"
          grep -q 'Icon="/Assets/app-icon.ico"' "$window"
          grep -q 'Scripts/build_macos_icon.sh' "$workflow"
          grep -q 'CFBundleIconFile' "$workflow"
          grep -q 'PhotoOrganizer.icns' "$workflow"

          # Normal CI must exercise every release runtime/outer container without
          # requiring production signing material.
          grep -q "@('x64', 'arm64')" Scripts/smoke_package_windows.ps1
          grep -q 'for arch in arm64 x64' Scripts/smoke_package_macos.sh
          grep -q 'hdiutil verify' Scripts/smoke_package_macos.sh
          grep -q 'Expand-Archive' Scripts/smoke_package_windows.ps1

          # Signed artifacts are acceptance candidates first. The build workflow must
          # never make them the public stable/latest release on its own.
          grep -q -- '--prerelease' "$workflow"
          if grep -q -- '--latest' "$workflow"; then
            echo 'release.yml must not promote an unaccepted candidate to latest.'
            exit 1
          fi

          # Stable promotion requires an explicit real-device acceptance record.
          grep -q 'acceptance_confirmed' "$promotion"
          grep -q 'candidate_commit' "$promotion"
          grep -q 'ACCEPTANCE_EVIDENCE' "$promotion"
          grep -q 'prerelease.*true' "$promotion"
          grep -q 'make_latest.*true' "$promotion"
          grep -q 'RELEASE_ACCEPTANCE.md' "$promotion"

  required:
    name: required
    if: always()
    needs: [test-and-build, package-smoke-windows, package-smoke-macos, release-contract]
    runs-on: ubuntu-latest
    steps:
      - name: Require every platform, packaging and release-contract job
        shell: bash
        run: |
          if [ "${{ needs.test-and-build.result }}" != "success" ] || \
             [ "${{ needs.package-smoke-windows.result }}" != "success" ] || \
             [ "${{ needs.package-smoke-macos.result }}" != "success" ] || \
             [ "${{ needs.release-contract.result }}" != "success" ]; then
            echo "At least one required Windows/macOS/package/release-contract job failed."
            exit 1
          fi
